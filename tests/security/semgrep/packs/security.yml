rules:
  - id: wpsr.php.request-to-raw-wpdb
    message: Request data reaches a raw WordPress database execution sink without an approved sanitizer/preparation boundary.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[$KEY]
          - pattern: $_POST[$KEY]
          - pattern: $_REQUEST[$KEY]
          - pattern: $request->get(...)
          - pattern: $request->all()
    pattern-sanitizers:
      - pattern: $wpdb->prepare(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $wpdb->query($SQL)
              - pattern: $wpdb->get_results($SQL, ...)
              - pattern: $wpdb->get_row($SQL, ...)
              - pattern: $wpdb->get_var($SQL, ...)
              - pattern: $wpdb->get_col($SQL, ...)
          - focus-metavariable: $SQL
    metadata:
      category: security
      technology: [wordpress, php]
      cwe: CWE-89

  - id: wpsr.php.request-to-html-output
    message: Request data reaches PHP HTML output without a context-appropriate escaping boundary.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[$KEY]
          - pattern: $_POST[$KEY]
          - pattern: $_REQUEST[$KEY]
          - pattern: $request->get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: esc_html(...)
          - pattern: esc_attr(...)
          - pattern: esc_url(...)
          - pattern: wp_kses(...)
          - pattern: wp_kses_post(...)
          - pattern: sanitize_text_field(...)
          - pattern: json_encode(...)
          - pattern: wp_json_encode(...)
    pattern-sinks:
      - pattern-either:
          - pattern: echo $VALUE;
          - pattern: print $VALUE;
    metadata:
      category: security
      technology: [wordpress, php]
      cwe: CWE-79

  - id: wpsr.php.request-to-unsafe-redirect
    message: Request-controlled URL reaches wp_redirect(); validate destination and use wp_safe_redirect().
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[$KEY]
          - pattern: $_POST[$KEY]
          - pattern: $_REQUEST[$KEY]
          - pattern: $request->get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: wp_validate_redirect(..., '/')
          - pattern: wp_validate_redirect(..., home_url(...))
          - pattern: wp_validate_redirect(..., admin_url(...))
    pattern-sinks:
      - patterns:
          - pattern: wp_redirect($URL, ...)
          - focus-metavariable: $URL
    metadata:
      category: security
      technology: [wordpress, php]
      cwe: CWE-601

  - id: wpsr.php.request-to-file-write
    message: Request-controlled path reaches a filesystem write/delete sink without filename/path validation.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[$KEY]
          - pattern: $_POST[$KEY]
          - pattern: $_REQUEST[$KEY]
          - pattern: $_FILES[$KEY]
          - pattern: $request->get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: sanitize_file_name(...)
          - pattern: wp_unique_filename(...)
          - pattern: realpath(...)
          - pattern: basename(...)
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: file_put_contents($PATH, ...)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: wp_delete_file($PATH)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: unlink($PATH)
              - focus-metavariable: $PATH
    metadata:
      category: security
      technology: [wordpress, php]
      cwe: CWE-22

  - id: wpsr.js.ajax-response-to-dom-html
    message: AJAX response data reaches HTML parser sink; require server-owned escaped markup or use text/DOM construction.
    severity: WARNING
    languages: [javascript]
    patterns:
      - pattern-either:
          - pattern: $ELEMENT.html($RESPONSE.$FIELD)
          - pattern: $ELEMENT.innerHTML = $RESPONSE.$FIELD
      - metavariable-regex:
          metavariable: $RESPONSE
          regex: (?i)^(response|result|data)$
    metadata:
      category: security
      technology: [javascript, jquery]
      cwe: CWE-79

  - id: wpsr.php.request-state-change-without-guard
    message: Direct request data reaches persistent WordPress state without a nearby nonce guard.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $FUNC(...) {
                ...
                $VALUE = $_REQUEST[$KEY];
                ...
                update_option(..., $VALUE, ...);
                ...
              }
          - pattern-inside: |
              function $FUNC(...) {
                ...
                $VALUE = $_POST[$KEY];
                ...
                update_post_meta(..., $VALUE, ...);
                ...
              }
      - pattern-either:
          - pattern: update_option(..., $VALUE, ...)
          - pattern: update_post_meta(..., $VALUE, ...)
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            check_ajax_referer(...);
            ...
            $VALUE = $_REQUEST[$KEY];
            ...
            update_option(..., $VALUE, ...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            check_ajax_referer(...);
            ...
            $VALUE = $_POST[$KEY];
            ...
            update_post_meta(..., $VALUE, ...);
            ...
          }
    metadata:
      category: security
      technology: [wordpress, php]
      cwe: CWE-352

  - id: wpsr.js.location-to-dom-html
    message: Browser URL data reaches an HTML parser sink; use textContent or validated DOM construction.
    severity: ERROR
    languages: [javascript]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: new URLSearchParams(window.location.search).get(...)
          - pattern: new URLSearchParams(location.search).get(...)
          - pattern: window.location.hash
          - pattern: location.hash
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: $ELEMENT.innerHTML = $VALUE
              - focus-metavariable: $VALUE
          - patterns:
              - pattern: $ELEMENT.html($VALUE)
              - focus-metavariable: $VALUE
    metadata:
      category: security
      technology: [javascript, dom]
      cwe: CWE-79
