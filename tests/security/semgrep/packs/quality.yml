rules:
  - id: wpsr.php.public-album-handler-without-guard
    message: Public Facebook album dispatch must verify nonce and public template ownership before delegated hook execution.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-inside: |
          public function handleAlbumPhoto(...) {
            ...
          }
      - pattern: do_action('wpsocialreviews/facebook_feed_handle_album_photo', ...)
      - pattern-not-inside: |
          public function handleAlbumPhoto(...) {
            ...
            check_ajax_referer(...);
            ...
            do_action('wpsocialreviews/facebook_feed_handle_album_photo', ...);
            ...
          }
      - pattern-not-inside: |
          public function handleAlbumPhoto(...) {
            ...
            wp_verify_nonce(...);
            ...
            do_action('wpsocialreviews/facebook_feed_handle_album_photo', ...);
            ...
          }
      - pattern-not-inside: |
          public function handleAlbumPhoto(...) {
            ...
            if (!check_ajax_referer(...)) {
              ...
            }
            ...
            do_action('wpsocialreviews/facebook_feed_handle_album_photo', ...);
            ...
          }
      - pattern-not-inside: |
          public function handleAlbumPhoto(...) {
            ...
            if (!wp_verify_nonce(...)) {
              ...
            }
            ...
            do_action('wpsocialreviews/facebook_feed_handle_album_photo', ...);
            ...
          }
    metadata:
      category: security-quality
      technology: [wordpress, php]
      fix_plan: 28

  - id: wpsr.js.live-container-untrusted-html-parser
    message: sanitizeHtml() parses untrusted feed HTML in a live element; use inert template.content before allowlist traversal.
    severity: ERROR
    languages: [javascript]
    patterns:
      - pattern-inside: |
          function sanitizeHtml($HTML) {
            ...
          }
      - pattern: |
          $TEMP = document.createElement('div');
          ...
          $TEMP.innerHTML = $HTML;
    metadata:
      category: security-quality
      technology: [javascript, dom]
      fix_plan: security-inert-feed-html

  - id: wpsr.php.unslash-around-json-decode
    message: >-
      Request values reach controllers already unslashed: WP_REST_Server unslashes
      $_POST/$_GET and JSON bodies are read raw. Pairing wp_unslash() with json_decode()
      therefore strips backslashes the user typed, or breaks the parse outright. Decode
      only, through Controller::decodeJsonParam(). A raw superglobal read is the one
      exception and is excluded below — WordPress really does slash those. This rule
      matches by shape, so an indirect variable of unknown origin still needs a human.
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: |
              $VALUE = json_decode($RAW, ...);
              $VALUE = wp_unslash($VALUE);
          - pattern: |
              $VALUE = wp_unslash($RAW);
              $DECODED = json_decode($VALUE, ...);
          - pattern: json_decode(wp_unslash(...), ...)
      # Superglobals arrive slashed, so unslashing them is required, not a defect.
      # Only a visible read is excluded; the shape cannot see through a variable.
      - pattern-not: json_decode(wp_unslash($_GET[$KEY]), ...)
      - pattern-not: json_decode(wp_unslash($_POST[$KEY]), ...)
      - pattern-not: json_decode(wp_unslash($_REQUEST[$KEY]), ...)
      - pattern-not: json_decode(wp_unslash($_COOKIE[$KEY]), ...)
      - pattern-not: |
          $VALUE = wp_unslash($_GET[$KEY]);
          $DECODED = json_decode($VALUE, ...);
      - pattern-not: |
          $VALUE = wp_unslash($_POST[$KEY]);
          $DECODED = json_decode($VALUE, ...);
      - pattern-not: |
          $VALUE = wp_unslash($_REQUEST[$KEY]);
          $DECODED = json_decode($VALUE, ...);
      - pattern-not: |
          $VALUE = wp_unslash($_COOKIE[$KEY]);
          $DECODED = json_decode($VALUE, ...);
    metadata:
      category: quality
      technology: [wordpress, php]
