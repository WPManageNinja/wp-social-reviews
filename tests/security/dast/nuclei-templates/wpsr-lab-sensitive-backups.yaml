id: wpsr-lab-sensitive-backups

info:
  name: WordPress sensitive backup exposure
  author: wp-social-ninja-test-suite
  severity: high
  description: Checks small fixed set of common WordPress config backup names without fuzzing.
  tags: wordpress,exposure,wpsr-lab

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-config.php.bak"
      - "{{BaseURL}}/wp-config.php~"
      - "{{BaseURL}}/.wp-config.php.swp"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "DB_NAME"
          - "DB_PASSWORD"
        condition: and
