id: wpsr-lab-wordpress-readme

info:
  name: Stock WordPress readme exposed in disposable lab
  author: wp-social-ninja-test-suite
  severity: low
  description: Known stock WordPress baseline exposure retained as visible allowlisted evidence.
  tags: wordpress,exposure,wpsr-lab

http:
  - method: GET
    path:
      - "{{BaseURL}}/readme.html"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Semantic Personal Publishing Platform"
