id: wpsr-lab-wordpress-detect

info:
  name: WP Social Ninja lab WordPress detection
  author: wp-social-ninja-test-suite
  severity: info
  description: Confirms scanner reached disposable WordPress REST index.
  tags: wordpress,tech,wpsr-lab

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-json/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"namespaces"'
          - '"wp/v2"'
        condition: and
