name: wp-social-ninja-test-lab

# Suite-only WordPress. Web binds loopback; DB has no host port; network blocks egress.
# Core and optional Pro checkouts mount read-only at workspace and plugin paths.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WPSR_LAB_DB_NAME:-wpsocialninja_test_lab}
      MARIADB_USER: ${WPSR_LAB_DB_USER:-wpsr_lab}
      MARIADB_PASSWORD: ${WPSR_LAB_DB_PASSWORD:-wpsr_lab_only}
      MARIADB_ROOT_PASSWORD: ${WPSR_LAB_DB_ROOT_PASSWORD:-wpsr_root_lab_only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: "no"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WPSR_LAB_DB_NAME:-wpsocialninja_test_lab}
      WORDPRESS_DB_USER: ${WPSR_LAB_DB_USER:-wpsr_lab}
      WORDPRESS_DB_PASSWORD: ${WPSR_LAB_DB_PASSWORD:-wpsr_lab_only}
      WORDPRESS_TABLE_PREFIX: ${WPSR_LAB_TABLE_PREFIX:-wpsntest_}
      WORDPRESS_DEBUG: "1"
      WPSR_TEST_LAB: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://wordpress');
        define('WP_SITEURL', 'http://wordpress');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISABLE_WP_CRON', true);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 80); if (!$$s) exit(1); fclose($$s);"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: "no"
    ports:
      - "127.0.0.1:8892:80"
    volumes:
      - wordpress_data:/var/www/html
      - ../../:/workspace/wp-social-ninja:ro
      - ../../:/var/www/html/wp-content/plugins/wp-social-ninja:ro
      - ${WPSR_PRO_ROOT:-../../../wp-social-ninja-pro}:/workspace/wp-social-ninja-pro:ro
      - ${WPSR_PRO_ROOT:-../../../wp-social-ninja-pro}:/var/www/html/wp-content/plugins/wp-social-ninja-pro:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  php-tests:
    build:
      context: ..
      dockerfile: lab/Dockerfile.php-tests
    image: wp-social-ninja-php-tests:local
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    entrypoint: [""]
    user: "33:33"
    environment:
      WORDPRESS_ROOT_DIR: /var/www/html
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WPSR_LAB_DB_NAME:-wpsocialninja_test_lab}
      WORDPRESS_DB_USER: ${WPSR_LAB_DB_USER:-wpsr_lab}
      WORDPRESS_DB_PASSWORD: ${WPSR_LAB_DB_PASSWORD:-wpsr_lab_only}
      WORDPRESS_TABLE_PREFIX: ${WPSR_LAB_TABLE_PREFIX:-wpsntest_}
      WPSR_TEST_ENV: ${WPSR_TEST_ENV:-core}
      WPSR_PHASE29_PROOF: ${WPSR_PHASE29_PROOF:-}
      WPSR_TEST_LAB: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    profiles: ["tools"]
    working_dir: /workspace/wp-social-ninja
    volumes:
      - wordpress_data:/var/www/html
      - ../../:/workspace/wp-social-ninja:ro
      - ../../:/var/www/html/wp-content/plugins/wp-social-ninja:ro
      - ${WPSR_PRO_ROOT:-../../../wp-social-ninja-pro}:/workspace/wp-social-ninja-pro:ro
      - ${WPSR_PRO_ROOT:-../../../wp-social-ninja-pro}:/var/www/html/wp-content/plugins/wp-social-ninja-pro:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    profiles: ["security"]
    network_mode: "service:wordpress"
    environment:
      WPSR_DAST_TARGET: http://127.0.0.1:80
    entrypoint: ["/scanner/run-zap.sh"]
    volumes:
      - ../.artifacts/security:/zap/wrk
      - ../security/dast:/scanner:ro

  nuclei:
    image: projectdiscovery/nuclei:v3.11.0
    profiles: ["security"]
    network_mode: "service:wordpress"
    environment:
      WPSR_DAST_TARGET: http://127.0.0.1:80
    entrypoint: ["/scanner/run-nuclei.sh"]
    volumes:
      - ../.artifacts/security:/zap/wrk
      - ../security/dast:/scanner:ro

networks:
  default:
    internal: true

volumes:
  db_data:
  wordpress_data:
